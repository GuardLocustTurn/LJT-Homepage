name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable GitHub Pages with Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          payload="$(mktemp)"
          printf '%s' '{"build_type":"workflow"}' > "$payload"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" --input "$payload" \
            || gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" --input "$payload"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
