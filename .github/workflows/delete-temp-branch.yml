name: Delete temporary personalization branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete personalization-temp ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/heads/personalization-temp"
